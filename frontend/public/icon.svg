<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />
  
  <!-- Outer radar rings -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8 8" opacity="0.3" />
  <circle cx="256" cy="240" r="120" fill="none" stroke="#10b981" stroke-width="3" opacity="0.5" />
  <circle cx="256" cy="240" r="70" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" />

  <!-- Shield Core -->
  <path d="M256 120 L340 160 V260 C340 320 290 370 256 390 C222 370 172 320 172 260 V160 Z" 
        fill="url(#shieldGrad)" opacity="0.15" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Disruption Pulse / Warning Bolt -->
  <path d="M268 180 L224 250 H260 L244 320 L296 242 H256 Z" 
        fill="url(#pulseGrad)" filter="drop-shadow(0 4px 12px rgba(245, 158, 11, 0.5))" />
  
  <!-- Badge text / dot -->
  <circle cx="256" cy="430" r="12" fill="#10b981" />
  <circle cx="256" cy="430" r="20" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="14;28;14" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

