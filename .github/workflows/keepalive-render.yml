name: Keep Render Backend Warm

on:
  schedule:
    # Render Free Tier spins down after 15 minutes of inactivity; ping every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 45 https://real-time-alert-wuvs.onrender.com/api/v1/health
